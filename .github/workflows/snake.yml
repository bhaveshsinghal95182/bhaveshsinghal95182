name: Generate snake animation

on:
  schedule: # execute every 12 hours
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate snake-light.svg and snake-dark.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Dots use the portfolio palette: sage greens on paper, coral snake.
          outputs: |
            dist/snake-light.svg?color_snake=%23e65959&color_dots=%23dcddd0,%23c9cabd,%2390b492,%235f7a61,%234f7a53
            dist/snake-dark.svg?color_snake=%23f07a7a&color_dots=%231c1d17,%232b2c25,%234f7a53,%235f7a61,%238fbe94

      - name: push the svgs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
